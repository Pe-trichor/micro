# 关闭 UART 控制台与 Zephyr 日志，避免噪声
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=n

# 启用 SEGGER RTT 内核支持（我们直接用 SEGGER_RTT API）
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=n

# 堆与栈（音频缓冲 + 发送）
CONFIG_HEAP_MEM_POOL_SIZE=331072
CONFIG_MAIN_STACK_SIZE=4096

# NRFX 基础

CONFIG_NRFX_CLOCK=y
CONFIG_NRFX_PDM=y

